<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>꼬맹이 건강 다이어리</title>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="꼬맹이">
    <meta name="theme-color" content="#9B8EC4">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        :root {
            --primary:#9B8EC4; --primary-light:#D4CCF0; --primary-dark:#7A6AAF;
            --bg:#F5F3FA; --card:#FFFFFF; --text:#2D2D2D; --text-light:#909090;
            --success:#5BAD8F; --danger:#E57373; --warning:#F5A623;
            --border:#EAE6F5; --nav-height:66px; --header-height:58px;
        }
        body { font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Segoe UI',sans-serif; background:var(--bg); color:var(--text); max-width:430px; margin:0 auto; min-height:100vh; }

        /* ─── Header ─── */
        .app-header { position:fixed; top:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; height:var(--header-height); background:var(--primary); color:white; display:flex; align-items:center; justify-content:space-between; padding:0 18px; z-index:100; box-shadow:0 2px 10px rgba(155,142,196,.35); }
        .app-header h1 { font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .app-header .today-date { font-size:12px; opacity:.88; white-space:nowrap; flex-shrink:0; margin-left:8px; }

        /* ─── Main ─── */
        .app-main { padding-top:calc(var(--header-height) + 10px); padding-bottom:calc(var(--nav-height) + 10px); }

        /* ─── Bottom Nav ─── */
        .bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; height:var(--nav-height); background:white; border-top:1px solid var(--border); display:flex; z-index:100; padding-bottom:env(safe-area-inset-bottom); }
        .nav-item { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; cursor:pointer; border:none; background:none; color:var(--text-light); font-size:10px; font-weight:600; padding:8px 0; transition:color .15s; position:relative; }
        .backup-dot { position:absolute; top:6px; right:calc(50% - 16px); width:8px; height:8px; border-radius:50%; background:#E57373; display:none; }
        .backup-dot.show { display:block; }
        .nav-item .nav-icon { font-size:20px; line-height:1; }
        .nav-item.active { color:var(--primary); }

        /* ─── Views ─── */
        .view { display:none; padding:0 12px; }
        .view.active { display:block; }

        /* ─── Card ─── */
        .card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:11px; box-shadow:0 1px 6px rgba(0,0,0,.07); }
        .card-title { font-size:11px; font-weight:700; color:var(--text-light); text-transform:uppercase; letter-spacing:.8px; margin-bottom:13px; }

        /* ─── Record Buttons ─── */
        .record-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
        .record-btn { background:var(--bg); border:1.5px solid var(--border); border-radius:12px; padding:9px 2px 8px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; transition:all .12s; min-height:64px; user-select:none; }
        .record-btn:active { transform:scale(.93); background:var(--primary-light); border-color:var(--primary); }
        .record-btn .btn-icon { font-size:21px; line-height:1; display:flex; align-items:center; justify-content:center; }
        .record-btn .btn-label { font-size:12px; font-weight:700; white-space:nowrap; }
        .record-btn .btn-count { font-size:9.5px; color:var(--text-light); white-space:nowrap; }

        /* ─── Medication List ─── */
        .med-item { display:flex; align-items:center; padding:11px 0; border-bottom:1px solid var(--border); gap:12px; }
        .med-item:last-child { border-bottom:none; padding-bottom:0; }
        .med-item:first-child { padding-top:0; }
        .med-check-btn { width:42px; height:42px; border-radius:50%; border:2.5px solid var(--border); background:none; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:18px; transition:all .18s; flex-shrink:0; }
        .med-check-btn.done { background:var(--success); border-color:var(--success); color:white; }
        .med-info { flex:1; min-width:0; }
        .med-name { font-size:15px; font-weight:600; }
        .med-period { font-size:12px; color:var(--text-light); margin-top:2px; }
        .med-badge { font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap; flex-shrink:0; }
        .med-badge.done { background:#E8F5EE; color:var(--success); }
        .med-badge.pending { background:#FFF8EE; color:var(--warning); }

        /* ─── Today Records ─── */
        .rec-item { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
        .rec-item:last-child { border-bottom:none; padding-bottom:0; }
        .rec-item:first-child { padding-top:0; }
        .rec-icon { font-size:22px; width:30px; text-align:center; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
        .rec-info { flex:1; min-width:0; }
        .rec-label { font-size:13px; font-weight:600; }
        .rec-time { font-size:11px; color:var(--text-light); margin-top:1px; }
        .rec-amount { font-size:13px; font-weight:700; color:var(--primary); flex-shrink:0; }
        /* ─── Timeline ─── */
        .tl-item { display:flex; align-items:baseline; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); }
        .tl-item:last-child { border-bottom:none; }
        .tl-time { font-size:10.5px; color:var(--primary); font-weight:700; flex-shrink:0; width:56px; text-align:right; white-space:nowrap; }
        .tl-label { flex:1; font-size:13px; color:var(--text); }
        .tl-sub { font-size:11px; color:var(--text-light); margin-top:1px; }
        .tl-med { color:var(--text-light); font-size:11px; }
        .rec-del-btn { width:28px; height:28px; border-radius:50%; border:none; background:#FFEBEE; color:var(--danger); cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

        /* ─── Calendar ─── */
        .cal-nav { display:flex; align-items:center; justify-content:space-between; padding:0 4px; margin-bottom:14px; }
        .cal-nav-btn { width:38px; height:38px; border:none; background:var(--bg); border-radius:50%; font-size:15px; cursor:pointer; transition:background .15s; }
        .cal-nav-btn:active { background:var(--primary-light); }
        .cal-month-label { font-size:18px; font-weight:700; }
        .cal-weekdays { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; margin-bottom:3px; }
        .cal-wd { font-size:11px; font-weight:600; color:var(--text-light); padding:3px 0; }
        .cal-wd.sun { color:#E57373; } .cal-wd.sat { color:#7986CB; }
        .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; }
        .cal-day { display:flex; flex-direction:column; align-items:center; padding:2px 1px 4px; border-radius:6px; cursor:pointer; min-height:52px; transition:background .1s; }
        .cal-day:active { background:var(--primary-light); }
        .cal-day.today { background:var(--primary-light); }
        .cal-day.other-month { opacity:.28; }
        .cal-day-num { font-size:12px; font-weight:600; padding:2px 0; line-height:1; }
        .cal-day.sun .cal-day-num { color:#E57373; }
        .cal-day.sat .cal-day-num { color:#7986CB; }
        .cal-day.today .cal-day-num { background:var(--primary); color:white; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; }
        .cal-line { font-size:9px; line-height:1.6; width:100%; text-align:center; white-space:nowrap; color:var(--text); overflow:hidden; text-overflow:ellipsis; }

        /* ─── Calendar Filter ─── */
        .cal-filter-row { display:flex; flex-wrap:wrap; gap:5px; }
        .cal-filter-btn { padding:4px 10px; border-radius:20px; border:1.5px solid var(--border); background:none; font-size:12px; color:var(--text-light); cursor:pointer; transition:.15s; }
        .cal-filter-btn.active { background:var(--primary); border-color:var(--primary); color:white; font-weight:600; }

        /* ─── Day Detail Panel ─── */
        .day-detail-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
        .day-detail-title { font-size:15px; font-weight:700; }
        .day-detail-close { width:28px; height:28px; border-radius:50%; border:none; background:var(--bg); cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; }
        .detail-item { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); font-size:14px; }
        .detail-item:last-child { border-bottom:none; }
        .detail-time-btn { background:none; border:none; cursor:pointer; color:var(--primary); font-size:11px; font-weight:600; text-decoration:underline; padding:0 2px; white-space:nowrap; flex-shrink:0; }
        .detail-section-label { font-size:11px; font-weight:700; color:var(--text-light); text-transform:uppercase; letter-spacing:.6px; padding:8px 0 4px; }

        /* ─── Graph ─── */
        .period-tabs { display:flex; gap:8px; margin-bottom:14px; }
        .period-tab { flex:1; padding:8px; text-align:center; border-radius:8px; border:2px solid var(--border); cursor:pointer; font-size:13px; font-weight:700; background:none; color:var(--text-light); transition:all .15s; }
        .period-tab.active { background:var(--primary); border-color:var(--primary); color:white; }
        .chart-wrap { position:relative; width:100%; height:200px; }
        .chart-subtitle { font-size:13px; font-weight:700; color:var(--text); margin-bottom:10px; }

        /* ─── Memo View ─── */
        .memo-card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:10px; box-shadow:0 1px 5px rgba(0,0,0,.06); }
        .memo-card-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
        .memo-card-title { font-size:15px; font-weight:700; }
        .memo-card-date { font-size:11px; color:var(--text-light); margin-top:3px; }
        .memo-card-body { font-size:13px; line-height:1.65; color:var(--text); white-space:pre-wrap; }

        /* ─── Settings ─── */
        .med-setting-item { display:flex; align-items:center; padding:12px 0; border-bottom:1px solid var(--border); gap:10px; }
        .med-setting-item:last-child { border-bottom:none; padding-bottom:0; }
        .med-setting-item:first-child { padding-top:0; }
        .med-setting-info { flex:1; min-width:0; }
        .med-setting-name { font-size:15px; font-weight:600; }
        .med-setting-detail { font-size:12px; color:var(--text-light); margin-top:2px; }
        .icon-btn { width:36px; height:36px; border-radius:8px; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px; }
        .edit-btn { background:#EDE9F8; color:var(--primary-dark); }
        .add-btn { width:100%; padding:13px; border-radius:12px; border:2px dashed var(--primary-light); background:none; color:var(--primary); font-size:14px; font-weight:700; cursor:pointer; margin-top:8px; }

        /* ─── Modal ─── */
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:200; align-items:flex-end; justify-content:center; }
        .modal-overlay.show { display:flex; }
        .modal-sheet { background:white; width:100%; max-width:430px; border-radius:22px 22px 0 0; padding:0 20px; max-height:88vh; overflow-y:auto; padding-bottom:max(32px,env(safe-area-inset-bottom)); }
        .modal-handle { width:40px; height:4px; background:var(--border); border-radius:2px; margin:14px auto 18px; }
        .modal-title { font-size:18px; font-weight:700; margin-bottom:18px; text-align:center; }
        .form-group { margin-bottom:14px; }
        .form-label { font-size:12px; font-weight:700; color:var(--text-light); margin-bottom:6px; display:block; }
        .form-input { width:100%; padding:12px 14px; border:2px solid var(--border); border-radius:10px; font-size:16px; outline:none; transition:border-color .15s; background:white; color:var(--text); -webkit-appearance:none; }
        .form-input:focus { border-color:var(--primary); }
        textarea.form-input { resize:vertical; min-height:90px; font-family:inherit; }
        .modal-btns { display:flex; gap:8px; margin-top:18px; }
        .btn-cancel { flex:1; padding:14px; border-radius:12px; border:2px solid var(--border); background:none; font-size:15px; font-weight:700; cursor:pointer; color:var(--text-light); }
        .btn-confirm { flex:2; padding:14px; border-radius:12px; border:none; background:var(--primary); color:white; font-size:15px; font-weight:700; cursor:pointer; }
        .modal-type-btn { display:flex; align-items:center; gap:12px; padding:13px 16px; border-radius:13px; border:2px solid var(--border); background:var(--bg); font-size:16px; font-weight:600; color:var(--text); cursor:pointer; text-align:left; transition:all .12s; width:100%; }
        .modal-type-btn:active { background:var(--primary-light); border-color:var(--primary); }
        .modal-type-btn.med-done-btn { background:#f0faf5; border-color:var(--success); opacity:.85; }
        .btn-del { flex:1; padding:14px; border-radius:12px; border:none; background:var(--danger); color:white; font-size:15px; font-weight:700; cursor:pointer; }
        .period-chips { display:flex; flex-wrap:wrap; gap:8px; }
        .p-chip { padding:9px 15px; border-radius:20px; border:2px solid var(--border); background:none; font-size:13px; font-weight:700; cursor:pointer; color:var(--text-light); transition:all .12s; }
        .p-chip.on { background:var(--primary); border-color:var(--primary); color:white; }

        /* ─── Empty / Toast ─── */
        .empty { text-align:center; padding:20px 0; color:var(--text-light); font-size:13px; }
        .empty-icon { font-size:32px; margin-bottom:6px; }
        .toast { position:fixed; bottom:calc(var(--nav-height)+14px); left:50%; transform:translateX(-50%) translateY(20px); background:#333; color:white; padding:9px 20px; border-radius:20px; font-size:13px; font-weight:600; opacity:0; transition:all .25s; z-index:300; white-space:nowrap; pointer-events:none; }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<header class="app-header">
    <h1>🐈 꼬맹이 건강 다이어리</h1>
    <span class="today-date" id="header-date"></span>
</header>

<main class="app-main">

    <!-- ── 홈 ── -->
    <div id="view-home" class="view active">
        <div class="card">
            <div class="card-title">기록하기</div>
            <div class="record-grid">
                <button class="record-btn" onclick="openRecordModal('urine')">
                    <span class="btn-icon" id="urine-btn-icon"></span>
                    <span class="btn-label">소변</span>
                    <span class="btn-count" id="cnt-urine">오늘 0회</span>
                </button>
                <button class="record-btn" onclick="openRecordModal('feces')">
                    <span class="btn-icon">💩</span>
                    <span class="btn-label">대변</span>
                    <span class="btn-count" id="cnt-feces">오늘 0회</span>
                </button>
                <button class="record-btn" onclick="openRecordModal('fluids')">
                    <span class="btn-icon">💧</span>
                    <span class="btn-label">피하수액</span>
                    <span class="btn-count" id="cnt-fluids">오늘 0 ml</span>
                </button>
                <button class="record-btn" onclick="openRecordModal('water')">
                    <span class="btn-icon">💦</span>
                    <span class="btn-label">물마심</span>
                    <span class="btn-count" id="cnt-water">오늘 0회</span>
                </button>
                <button class="record-btn" onclick="openDryFoodModal()">
                    <span class="btn-icon">🍴</span>
                    <span class="btn-label">건사료</span>
                    <span class="btn-count" id="cnt-dry">오늘 0 g</span>
                </button>
                <button class="record-btn" onclick="openRecordModal('wet_food')">
                    <span class="btn-icon">🥫</span>
                    <span class="btn-label">습식사료</span>
                    <span class="btn-count" id="cnt-wet">오늘 0 g</span>
                </button>
                <button class="record-btn" onclick="openSnackModal()">
                    <span class="btn-icon">🍭</span>
                    <span class="btn-label">간식</span>
                    <span class="btn-count" id="cnt-churu">오늘 0회</span>
                </button>
                <button class="record-btn" onclick="openAdhocMedModal()">
                    <span class="btn-icon">💊</span>
                    <span class="btn-label">투약</span>
                    <span class="btn-count">직접 입력</span>
                </button>
                <button class="record-btn" onclick="openMemoModal()" style="border-color:var(--primary-light)">
                    <span class="btn-icon">📝</span>
                    <span class="btn-label" style="color:var(--primary)">메모</span>
                    <span class="btn-count">일반·특이사항</span>
                </button>
                <button class="record-btn" onclick="openRecordModal('play')">
                    <span class="btn-icon">🧶</span>
                    <span class="btn-label">놀았음</span>
                    <span class="btn-count" id="cnt-play">오늘 0회</span>
                </button>
                <button class="record-btn" onclick="openCollectModal()">
                    <span class="btn-icon">🧹</span>
                    <span class="btn-label">수거량</span>
                    <span class="btn-count" id="cnt-collect">오늘 0 g</span>
                </button>
                <button class="record-btn" onclick="openRecordModal('weight')">
                    <span class="btn-icon">⚖️</span>
                    <span class="btn-label">몸무게</span>
                    <span class="btn-count" id="cnt-weight"></span>
                </button>
            </div>
        </div>

        <div class="card" id="card-weekly" style="display:none;padding:12px 16px">
            <div class="card-title" style="margin-bottom:8px">📈 주간 요약 <span style="font-weight:400;font-size:11px;color:var(--text-light)">(최근 7일 vs 이전 7일)</span></div>
            <div id="weekly-summary" style="display:flex;flex-direction:column;gap:5px;font-size:12.5px"></div>
        </div>

        <div class="card">
            <div class="card-title">오늘의 투약</div>
            <div id="med-list-home"></div>
        </div>

        <div class="card" id="card-timeline" style="display:none">
            <div class="card-title">📋 오늘 기록</div>
            <div id="today-timeline"></div>
        </div>
    </div>

    <!-- ── 달력 ── -->
    <div id="view-calendar" class="view">
        <div class="card">
            <div class="cal-nav">
                <button class="cal-nav-btn" onclick="changeMonth(-1)">◀</button>
                <span class="cal-month-label" id="cal-label"></span>
                <button class="cal-nav-btn" onclick="changeMonth(1)">▶</button>
            </div>
            <div class="cal-weekdays">
                <div class="cal-wd sun">일</div><div class="cal-wd">월</div>
                <div class="cal-wd">화</div><div class="cal-wd">수</div>
                <div class="cal-wd">목</div><div class="cal-wd">금</div>
                <div class="cal-wd sat">토</div>
            </div>
            <div class="cal-grid" id="cal-grid"></div>
        </div>
        <div class="card" style="padding:10px 12px;">
            <div class="cal-filter-row">
                <button class="cal-filter-btn active" data-filter="all" onclick="setCalFilter('all')">전체</button>
                <button class="cal-filter-btn" data-filter="none" onclick="setCalFilter('none')">전체해제</button>
                <button class="cal-filter-btn active" data-filter="med" onclick="setCalFilter('med')">💊 투약</button>
                <button class="cal-filter-btn active" data-filter="toilet" onclick="setCalFilter('toilet')">💛💩 대소변</button>
                <button class="cal-filter-btn active" data-filter="collect" onclick="setCalFilter('collect')">🧹 수거량</button>
                <button class="cal-filter-btn active" data-filter="fluids" onclick="setCalFilter('fluids')">💧 피하수액</button>
                <button class="cal-filter-btn active" data-filter="water" onclick="setCalFilter('water')">💦 물마심</button>
                <button class="cal-filter-btn active" data-filter="food" onclick="setCalFilter('food')">🍴🥫 사료</button>
                <button class="cal-filter-btn active" data-filter="play" onclick="setCalFilter('play')">🧶 놀았음</button>
                <button class="cal-filter-btn active" data-filter="memo" onclick="setCalFilter('memo')">⭐ 특이사항</button>
            </div>
        </div>
        <!-- 날짜별 상세 패널 (달력 하단) -->
        <div class="card" id="day-detail-panel" style="display:none">
            <div id="day-detail-content"></div>
        </div>
    </div>

    <!-- ── 그래프 ── -->
    <div id="view-graph" class="view">
        <div class="card">
            <div class="card-title">기간 선택</div>
            <div class="period-tabs">
                <button class="period-tab active" onclick="setPeriod(7,this)">7일</button>
                <button class="period-tab" onclick="setPeriod(14,this)">14일</button>
                <button class="period-tab" onclick="setPeriod(30,this)">30일</button>
            </div>
        </div>
        <div class="card">
            <div class="chart-subtitle">🍴🥫 식사량 (g)</div>
            <div class="chart-wrap"><canvas id="food-chart"></canvas></div>
        </div>
        <div class="card">
            <div class="chart-subtitle">💛💩 소변 · 대변 (회)</div>
            <div class="chart-wrap"><canvas id="toilet-chart"></canvas></div>
        </div>
        <div class="card">
            <div class="chart-subtitle">🧹 수거량 (개)</div>

<script>
// ═══════════════════════════════════════════
//  아이콘 & 상수
// ═══════════════════════════════════════════
// 소변: 노란 물방울 + 검은 아웃라인
// viewBox 0 0 20 28 (아래 호가 y=27까지 내려가므로 여백 포함)
// 종횡비 20:28 유지해서 잘림 방지
const DROP = (h=22) => { const w=Math.round(h*20/28); return `<svg width="${w}" height="${h}" viewBox="0 0 20 28" xmlns="http://www.w3.org/2000/svg"><path d="M10 1 C8 5 1 14 1 18 A9 9 0 0 0 19 18 C19 14 12 5 10 1Z" fill="#FFD700" stroke="#2D2D2D" stroke-width="1.6" stroke-linejoin="round"/><ellipse cx="7.5" cy="17" rx="2" ry="3" fill="rgba(255,255,255,0.38)" transform="rotate(-25,7.5,17)"/></svg>`; };

const TYPES = {
    urine:    { label:'소변',    icon:()=>'💛',  unit:'회',  hasAmt:false },
    feces:    { label:'대변',    icon:()=>'💩',  unit:'회',  hasAmt:false },
    urine_amt:{ label:'소변 수거', icon:()=>'💛', unit:'개', hasAmt:true  },
    feces_amt:{ label:'대변 수거', icon:()=>'💩', unit:'개', hasAmt:true  },
    fluids:   { label:'피하수액', icon:()=>'💧',  unit:'ml', hasAmt:true  },
    water:    { label:'물마심',  icon:()=>'💦',  unit:'회',  hasAmt:false },
    play:     { label:'놀았음',  icon:()=>'🧶',  unit:'회',  hasAmt:false },
    weight:   { label:'몸무게',  icon:()=>'⚖️',  unit:'kg', hasAmt:true  },
    dry_food: { label:'건사료',  icon:()=>'🍴',  unit:'g',  hasAmt:true  },
    wet_food: { label:'습식사료', icon:()=>'🥫',  unit:'g',  hasAmt:true  },
    churu:    { label:'츄르',    icon:()=>'🍭',  unit:'회',  hasAmt:false },
    memo:     { label:'메모',    icon:()=>'📝',  unit:'',   hasAmt:false },
};
const PERIODS = { morning:'아침', noon:'점심', evening:'저녁', night:'밤', once:'1일 1회' };
const PERIOD_ORDER = ['morning','noon','evening','night','once'];
function sortedPeriods(periods) {
    return [...periods].sort((a,b) => PERIOD_ORDER.indexOf(a) - PERIOD_ORDER.indexOf(b));
}

// ═══════════════════════════════════════════
//  데이터
// ═══════════════════════════════════════════
let records = [], meds = [];

function load() {
    records = JSON.parse(localStorage.getItem('km_records') || '[]');
    meds = JSON.parse(localStorage.getItem('km_meds') || 'null');
    if (!meds) {
        meds = [
            { id:uid(), name:'아조딜',     periods:['morning','evening'], active:true },
            { id:uid(), name:'안티놀래피드', periods:['once'],             active:true },
        ];
        saveMeds();
    }
}
function saveRecords() { localStorage.setItem('km_records', JSON.stringify(records)); }
function saveMeds()    { localStorage.setItem('km_meds',    JSON.stringify(meds)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

// ─── 날짜 유틸 ───
function dateStr(d) { d=d||new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function pad(n) { return String(n).padStart(2,'0'); }
// 하루 기준: 새벽 6시 (00:00~05:59 는 전날로 취급)
function today() { const n=new Date(); if(n.getHours()<6) n.setDate(n.getDate()-1); return dateStr(n); }
function nowTime() { const n=new Date(); return `${pad(n.getHours())}:${pad(n.getMinutes())}`; }
// 시간 정렬: 06:00 시작 기준 (00:00~05:59 는 하루의 끝쪽)
function tCmp(a,b) { const k=t=>(t<'06:00'?'2':'1')+t; return k(a.time).localeCompare(k(b.time)); }
// 날짜까지 포함한 정렬 키 (여러 날에 걸친 기록을 시간순으로 줄 세울 때)
function dayKey(r) { return r.date + (r.time < '06:00' ? '2' : '1') + r.time; }
function fmtTime(t) { const [h,m]=t.split(':').map(Number); return `${h<12?'오전':'오후'} ${h===0?12:h>12?h-12:h}:${pad(m)}`; }
function fmtDate(s) { const [y,mo,d]=s.split('-').map(Number); const days=['일','월','화','수','목','금','토']; return `${y}년 ${mo}월 ${d}일 (${days[new Date(y,mo-1,d).getDay()]})`; }

// ─── 기록 쿼리 ───
function recsFor(date) { return records.filter(r=>r.date===date); }
function isMedDone(medId,period,date) { return records.some(r=>r.type==='med'&&r.medId===medId&&r.period===period&&r.date===date); }

// 건사료 실제 섭취량 계산 (기존 기록 + 새 서브타입 호환)
function dryFoodConsumed(date) {
    return records.filter(r=>r.date===date&&r.type==='dry_food').reduce((sum,r)=>{
        if (!r.subtype)            return sum + (r.amt||0);          // 기존 방식
        if (r.subtype==='ate')     return sum + (r.amt||0);          // 먹은 양 입력 (양 없으면 0)
        if (r.subtype==='finish')  return sum + (r.servingAmt||0);   // 그릇 비움
        if (r.subtype==='leftover') return sum + Math.max(0,(r.servingAmt||0)-(r.amt||0)); // 남은량 차감
        return sum; // 'serve', 'ate' 는 집계 제외
    }, 0);
}
// 아직 소비 처리(완식/남은량)되지 않은 누적 급여량
// upToDate: 이 날짜까지의 이벤트만 계산 (달력에서 특정 날짜 기준으로 볼 때 사용)
function pendingDryFoodServing(upToDate) {
    const events = records
        .filter(r=>r.type==='dry_food'&&['serve','finish','leftover','discard'].includes(r.subtype))
        .filter(r=>!upToDate || r.date <= upToDate)
        .sort((a,b)=>dayKey(a).localeCompare(dayKey(b)));
    let pending = 0;
    events.forEach(r=>{
        if (r.subtype==='serve')                                          pending += (r.amt||0);
        else if (r.subtype==='finish'||r.subtype==='leftover'||r.subtype==='discard') pending = 0;
    });
    return pending;
}
// 건사료 이벤트 표시 정보 (서브타입별)
function dryFoodEventInfo(r) {
    if (!r.subtype) return { icon:'🍴', label:`건사료 ${r.amt}g` };
    if (r.subtype==='serve')    return { icon:'🥣', label:`건사료 급여 ${r.amt}g` };
    if (r.subtype==='ate')      return r.amt ? { icon:'😋', label:`건사료 섭취 ${r.amt}g` } : { icon:'😋', label:'건사료 먹었음' };
    if (r.subtype==='finish')   return { icon:'✅', label:`건사료 완식 (${r.servingAmt||0}g)` };
    if (r.subtype==='leftover') return { icon:'🌙', label:`건사료 남은량 ${r.amt}g → 섭취 ${Math.max(0,(r.servingAmt||0)-(r.amt||0))}g` };
    if (r.subtype==='discard')  return { icon:'🗑️', label:`건사료 잔반 비움 (${r.servingAmt||0}g 폐기)` };
    return { icon:'🍴', label:'건사료' };
}

function todayCounts() {
    const rs=recsFor(today());
    return {
        urine:    rs.filter(r=>r.type==='urine').length,
        feces:    rs.filter(r=>r.type==='feces').length,
        fluids:   rs.filter(r=>r.type==='fluids').reduce((s,r)=>s+(r.amt||0),0),
        water:    rs.filter(r=>r.type==='water').length,
        dry_food: dryFoodConsumed(today()),
        wet_food: rs.filter(r=>r.type==='wet_food').reduce((s,r)=>s+(r.amt||0),0),
        churu:    rs.filter(r=>r.type==='churu').length,
        play:     rs.filter(r=>r.type==='play').length,
        urine_amt:rs.filter(r=>r.type==='urine_amt').reduce((s,r)=>s+(r.amt||0),0),
        feces_amt:rs.filter(r=>r.type==='feces_amt').reduce((s,r)=>s+(r.amt||0),0),
    };
}

// ═══════════════════════════════════════════
//  뷰 전환
// ═══════════════════════════════════════════
let currentView = 'home';
function showView(view, btn) {
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
    document.getElementById(`view-${view}`).classList.add('active');
    if (btn) btn.classList.add('active');
    currentView = view;
    if (view==='home')     renderHome();
    if (view==='calendar') renderCal();
    if (view==='graph')    renderGraphs();
    if (view==='memo')     renderMemos();
    if (view==='settings') renderSettings();
}

// ═══════════════════════════════════════════
//  홈 렌더
// ═══════════════════════════════════════════
function renderHome() {
    // 소변 버튼 아이콘
    const ui = document.getElementById('urine-btn-icon');
    if (ui) ui.innerHTML = '💛';

    const c = todayCounts();
    document.getElementById('cnt-urine').textContent  = `오늘 ${c.urine}회`;
    document.getElementById('cnt-feces').textContent  = `오늘 ${c.feces}회`;
    document.getElementById('cnt-fluids').textContent = `오늘 ${c.fluids} ml`;
    document.getElementById('cnt-water').textContent  = `오늘 ${c.water}회`;
    document.getElementById('cnt-dry').textContent    = `오늘 ${c.dry_food} g`;
    document.getElementById('cnt-wet').textContent    = `오늘 ${c.wet_food} g`;
    document.getElementById('cnt-churu').textContent  = `오늘 ${c.churu}회`;
    document.getElementById('cnt-play').textContent   = `오늘 ${c.play}회`;

    // 수거량 버튼: 소변/대변 합산 (둘 다 있으면 나눠서)
    const cu = c.urine_amt, cf = c.feces_amt;
    document.getElementById('cnt-collect').textContent =
        (cu||cf) ? `💛${cu}개 💩${cf}개` : '오늘 없음';

    // 몸무게 버튼: 최근 기록 표시
    const lastW = records.filter(r=>r.type==='weight').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).pop();
    document.getElementById('cnt-weight').textContent = lastW
        ? `${lastW.amt}kg (${+lastW.date.split('-')[1]}/${+lastW.date.split('-')[2]})` : '기록하기';

    renderWeeklySummary();

    // 투약 목록 (아침→점심→저녁→밤→1일1회 순)
    const activeMeds = meds.filter(m=>m.active);
    const medEl = document.getElementById('med-list-home');
    if (!activeMeds.length) {
        medEl.innerHTML = `<div class="empty"><div class="empty-icon">💊</div>등록된 약이 없습니다.<br>설정에서 추가해 주세요.</div>`;
    } else {
        const allDoses = [];
        activeMeds.forEach(med => sortedPeriods(med.periods).forEach(p => allDoses.push({med,p})));
        medEl.innerHTML = allDoses.map(({med,p}) => {
            const done = isMedDone(med.id, p, today());
            const rec = records.find(r=>r.type==='med'&&r.medId===med.id&&r.period===p&&r.date===today());
            return `<div class="med-item">
                <button class="med-check-btn ${done?'done':''}" onclick="toggleMed('${med.id}','${p}')">
                    ${done?'✓':''}
                </button>
                <div class="med-info">
                    <div class="med-name">${med.name}</div>
                    <div class="med-period">${PERIODS[p]||p}${done&&rec?.time?` · ${fmtTime(rec.time)}`:''}</div>
                </div>
                <span class="med-badge ${done?'done':'pending'}">${done?'완료':'미완료'}</span>
            </div>`;
        }).join('');
    }

    // ── 통합 타임라인 (투약 포함 전체) ──
    const tlCard = document.getElementById('card-timeline');
    const tlEl   = document.getElementById('today-timeline');
    const t0 = today();

    // 투약 기록: 완료된 것만
    const medRecs = records.filter(r=>r.type==='med'&&r.date===t0);
    // 나머지 기록
    const otherRecs = recsFor(t0).filter(r=>r.type!=='med');
    // 합쳐서 시간순 정렬
    const allTl = [...medRecs, ...otherRecs].sort(tCmp);

    if (!allTl.length) {
        tlCard.style.display = 'none';
    } else {
        tlCard.style.display = '';
        tlEl.innerHTML = allTl.map(r => {
            const timeHtml = `<span class="tl-time">${fmtTime(r.time)}</span>`;
            if (r.type === 'med') {
                const medName = r.medName || (meds.find(m=>m.id===r.medId)?.name) || '투약';
                const periodLabel = r.period ? (PERIODS[r.period]||r.period) : '직접입력';
                return `<div class="tl-item">
                    ${timeHtml}
                    <div class="tl-label">💊 ${escHtml(medName)} <span class="tl-med">(${periodLabel})</span></div>
                </div>`;
            }
            if (r.type === 'memo') {
                const isSpecial = r.showOnCalendar !== false;
                const icon = isSpecial ? '⭐' : '📝';
                const titleText = r.title ? escHtml(r.title) : (isSpecial ? '특이사항' : '메모');
                return `<div class="tl-item" style="flex-direction:column;align-items:flex-start;gap:2px">
                    <div style="display:flex;align-items:baseline;gap:10px;width:100%">
                        ${timeHtml}
                        <div style="flex:1">${icon} <span class="tl-label">${titleText}</span></div>
                        <button class="rec-del-btn" onclick="delRecord('${r.id}')">✕</button>
                    </div>
                    ${r.body?`<div style="font-size:12px;color:var(--text-light);line-height:1.5;padding-left:64px;white-space:pre-wrap">${escHtml(r.body)}</div>`:''}
                </div>`;
            }
            if (r.type === 'dry_food' && r.subtype) {
                const info = dryFoodEventInfo(r);
                return `<div class="tl-item">
                    ${timeHtml}
                    <div class="tl-label" style="flex:1">${info.icon} ${info.label}</div>
                    <button class="rec-del-btn" style="color:var(--primary)" onclick="editRecordTime('${r.id}','${r.time}','${t0}')">✎</button>
                    <button class="rec-del-btn" onclick="delRecord('${r.id}')">✕</button>
                </div>`;
            }
            const tp = TYPES[r.type];
            const amt = tp?.hasAmt ? ` ${r.amt}${tp.unit}` : '';
            const icon = tp?.icon() || '';
            return `<div class="tl-item">
                ${timeHtml}
                <div class="tl-label" style="flex:1">${icon} ${tp?.label||r.type}${amt}</div>
                <button class="rec-del-btn" style="color:var(--primary)" onclick="editRecordTime('${r.id}','${r.time}','${t0}')">✎</button>
                <button class="rec-del-btn" onclick="delRecord('${r.id}')">✕</button>
            </div>`;
        }).join('');
    }
}

// ─── 주간 요약 (최근 7일 vs 이전 7일) ───
function renderWeeklySummary() {
    const card = document.getElementById('card-weekly');
    const el   = document.getElementById('weekly-summary');
    // 날짜 배열: today 기준 0~6일 전 (이번 주), 7~13일 전 (지난주)
    const dayList = n => { const a=[]; const [y,mo,d]=today().split('-').map(Number);
        for(let i=0;i<7;i++){ const dt=new Date(y,mo-1,d-n-i); a.push(dateStr(dt)); } return a; };
    const thisWk = dayList(0), lastWk = dayList(7);
    const dryOf   = ds => dryFoodConsumed(ds);
    const wetOf   = ds => recsFor(ds).filter(r=>r.type==='wet_food').reduce((s,r)=>s+(r.amt||0),0);
    const urineOf = ds => recsFor(ds).filter(r=>r.type==='urine').length;
    const avg = (dates,fn) => { const days=dates.filter(d=>recsFor(d).length>0); if(!days.length) return null;
        return days.reduce((s,d)=>s+fn(d),0)/days.length; };

    const rows = [];
    const mkRow = (icon,label,cur,prev,unit,dec) => {
        if (cur===null && prev===null) return;
        const f = v => v===null ? '—' : (Math.round(v*10)/10) + unit;
        let diffHtml = '';
        if (cur!==null && prev!==null) {
            const diff = Math.round((cur-prev)*10)/10;
            if (diff>0)      diffHtml = `<span style="color:#64B5F6;font-weight:700">▲${diff}</span>`;
            else if (diff<0) diffHtml = `<span style="color:#E57373;font-weight:700">▼${Math.abs(diff)}</span>`;
            else             diffHtml = `<span style="color:var(--text-light)">—</span>`;
        }
        rows.push(`<div style="display:flex;align-items:center;gap:6px">
            <span style="width:20px;text-align:center">${icon}</span>
            <span style="flex:1">${label} <strong>${f(cur)}</strong>/일</span>
            <span style="color:var(--text-light);font-size:11.5px">지난주 ${f(prev)}</span>
            ${diffHtml}
        </div>`);
    };
    mkRow('🍴','건사료 평균', avg(thisWk,dryOf),   avg(lastWk,dryOf),   'g');
    mkRow('🥫','습식 평균',  avg(thisWk,wetOf),   avg(lastWk,wetOf),   'g');
    mkRow('💛','소변 평균',  avg(thisWk,urineOf), avg(lastWk,urineOf), '회');

    // 몸무게: 최근 2개 기록 비교
    const ws = records.filter(r=>r.type==='weight').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
    if (ws.length) {
        const cur = ws[ws.length-1], prev = ws[ws.length-2];
        let diffHtml = '';
        if (prev) {
            const diff = Math.round((cur.amt-prev.amt)*100)/100;
            if (diff>0)      diffHtml = `<span style="color:#64B5F6;font-weight:700">▲${diff}</span>`;
            else if (diff<0) diffHtml = `<span style="color:#E57373;font-weight:700">▼${Math.abs(diff)}</span>`;
            else             diffHtml = `<span style="color:var(--text-light)">—</span>`;
        }
        const md = s => `${+s.split('-')[1]}/${+s.split('-')[2]}`;
        rows.push(`<div style="display:flex;align-items:center;gap:6px">
            <span style="width:20px;text-align:center">⚖️</span>
            <span style="flex:1">몸무게 <strong>${cur.amt}kg</strong> <span style="color:var(--text-light);font-size:11px">(${md(cur.date)})</span></span>
            ${prev?`<span style="color:var(--text-light);font-size:11.5px">이전 ${prev.amt}kg</span>`:''}
            ${diffHtml}
        </div>`);
    }

    if (!rows.length) { card.style.display='none'; return; }
    card.style.display='';
    el.innerHTML = rows.join('');
}

function toggleMed(medId, period) {

        <div class="form-group">
            <label class="form-label">시간</label>
            <input type="time" class="form-input" id="m-time" value="${nowTime()}">
        </div>`;
    setModal('', `
        <div class="modal-title">${iconHtml} ${t.label} 기록</div>
        <input type="hidden" id="m-date" value="${dateVal}">
        ${rowFields}
        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeModal()">취소</button>
            <button class="btn-confirm" onclick="saveRecord('${type}')">기록하기</button>
        </div>`, true);
    openModal();
    if (t.hasAmt) setTimeout(()=>document.getElementById('m-amt')?.focus(), 120);
}

function saveRecord(type) {
    const t = TYPES[type];
    const date = document.getElementById('m-date').value;
    const time = document.getElementById('m-time').value;
    let amt = null;
    if (t.hasAmt) {
        const v = parseFloat(document.getElementById('m-amt').value);
        if (isNaN(v)||v<0) { alert('양을 입력해 주세요.'); return; }
        amt = v;
    }
    records.push({id:uid(),type,date,time,amt});
    saveRecords(); closeModal();
    toast(`${t.label} 기록 완료!`);
    if (currentView==='home') renderHome();
    if (currentView==='calendar') { renderCal(); if(selectedDay) openDayDetail(selectedDay); }
}

// ═══════════════════════════════════════════
//  메모 (일반 메모 + 특이사항 토글)
// ═══════════════════════════════════════════
function openMemoModal(editId, defaultDate) {
    const existing = editId ? records.find(r=>r.id===editId) : null;
    const dateVal = existing?.date || defaultDate || today();
    // 기존 레코드: showOnCalendar 없으면 true (하위호환)
    const isSpecial = existing ? (existing.showOnCalendar !== false) : false;
    setModal('📝 메모', `
        <div class="form-group">
            <label class="form-label">내용</label>
            <textarea class="form-input" id="memo-body" placeholder="내용을 입력하세요..." style="min-height:80px">${existing?.body||''}</textarea>
        </div>
        <div style="margin-bottom:14px">
            <button id="memo-special-btn" onclick="toggleMemoSpecial()"
                style="width:100%;padding:11px;border-radius:12px;border:2px solid ${isSpecial?'var(--warning)':'var(--border)'};background:${isSpecial?'#FFF8EE':'var(--bg)'};font-size:14px;font-weight:600;color:${isSpecial?'var(--warning)':'var(--text-light)'};cursor:pointer;transition:all .15s">
                ${isSpecial?'⭐ 특이사항 (달력에 표시됨)':'☆ 일반 메모 — 특이사항으로 등록하려면 탭하세요'}
            </button>
        </div>
        <div id="memo-title-wrap" style="display:${isSpecial?'block':'none'}">
            <div class="form-group">
                <label class="form-label">달력 표시 제목 (최대 6자)</label>
                <input type="text" class="form-input" id="memo-title" maxlength="6" autocomplete="off"
                    value="${existing?.title||''}" placeholder="예: 구토, 식욕저하">
            </div>
        </div>
        <input type="hidden" id="memo-date" value="${dateVal}">
        <input type="hidden" id="memo-special" value="${isSpecial?'1':'0'}">
        <div class="form-group">
            <label class="form-label">시간</label>
            <input type="time" class="form-input" id="memo-time" value="${existing?.time||nowTime()}">
        </div>
        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeModal()">취소</button>
            ${existing?`<button class="btn-del" onclick="delMemo('${editId}')">삭제</button>`:''}
            <button class="btn-confirm" onclick="saveMemo('${editId||''}')">저장</button>
        </div>
    `);
    openModal();
    setTimeout(()=>document.getElementById('memo-body')?.focus(), 120);
}

function toggleMemoSpecial() {
    const hidden = document.getElementById('memo-special');
    const btn = document.getElementById('memo-special-btn');
    const wrap = document.getElementById('memo-title-wrap');
    const on = hidden.value === '0';
    hidden.value = on ? '1' : '0';
    btn.style.borderColor = on ? 'var(--warning)' : 'var(--border)';
    btn.style.background  = on ? '#FFF8EE' : 'var(--bg)';
    btn.style.color       = on ? 'var(--warning)' : 'var(--text-light)';
    btn.textContent       = on ? '⭐ 특이사항 (달력에 표시됨)' : '☆ 일반 메모 — 특이사항으로 등록하려면 탭하세요';
    wrap.style.display    = on ? 'block' : 'none';
}

function saveMemo(editId) {
    const body  = document.getElementById('memo-body').value.trim();
    if (!body) { alert('내용을 입력해 주세요.'); return; }
    const showOnCalendar = document.getElementById('memo-special').value === '1';
    const title = showOnCalendar ? document.getElementById('memo-title').value.trim() : '';
    if (showOnCalendar && !title) { alert('달력에 표시할 제목을 입력해 주세요.'); return; }
    const date  = document.getElementById('memo-date').value;
    const time  = document.getElementById('memo-time').value;
    if (editId) {
        const r = records.find(r=>r.id===editId);
        if (r) Object.assign(r, {title,body,date,time,showOnCalendar});
    } else {
        records.push({id:uid(),type:'memo',date,time,title,body,showOnCalendar});
    }
    saveRecords(); closeModal();
    toast(showOnCalendar ? '특이사항이 기록되었습니다 ⭐' : '메모가 기록되었습니다 📝');
    if (currentView==='home') renderHome();
    if (currentView==='calendar') { renderCal(); if(selectedDay) openDayDetail(selectedDay); }
    if (currentView==='memo') renderMemos();
}

function delMemo(id) {
    if (!confirm('이 메모를 삭제하시겠습니까?')) return;
    records = records.filter(r=>r.id!==id);
    saveRecords(); closeModal();
    if (currentView==='memo') renderMemos();
    if (currentView==='calendar') { renderCal(); if(selectedDay) openDayDetail(selectedDay); }
    if (currentView==='home') renderHome();
}

function renderMemos() {
    const memoRecs = records.filter(r=>r.type==='memo')
        .sort((a,b)=>b.date.localeCompare(a.date)||b.time.localeCompare(a.time));
    const wrap = document.getElementById('memo-list-wrap');
    if (!memoRecs.length) {
        wrap.innerHTML = `<div class="card"><div class="empty"><div class="empty-icon">📝</div>기록된 메모가 없습니다.<br>홈 화면에서 추가할 수 있습니다.</div></div>`;
        return;
    }
    wrap.innerHTML = memoRecs.map(r=>{
        const isSpecial = r.showOnCalendar !== false;
        const icon = isSpecial ? '⭐' : '📝';
        const titleText = r.title || (isSpecial ? '특이사항' : '메모');
        const badge = isSpecial
            ? `<span style="font-size:11px;background:#FFF3CD;color:#B8860B;border-radius:8px;padding:2px 7px;font-weight:600;vertical-align:middle">달력</span>`
            : '';
        return `<div class="memo-card">
            <div class="memo-card-header">
                <div style="flex:1">
                    <div class="memo-card-title">${icon} ${escHtml(titleText)} ${badge}</div>
                    <div class="memo-card-date">${fmtDate(r.date)} ${fmtTime(r.time)}</div>
                </div>
                <button class="icon-btn edit-btn" onclick="openMemoModal('${r.id}')">✏️</button>
            </div>
            ${r.body?`<div class="memo-card-body">${escHtml(r.body)}</div>`:''}
        </div>`;
    }).join('');
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }

// ═══════════════════════════════════════════
//  달력
// ═══════════════════════════════════════════
let calDate = new Date();
let selectedDay = null;
const CAL_FILTER_KEYS = ['med','toilet','collect','fluids','water','food','play','memo'];
let calFilters = new Set(CAL_FILTER_KEYS);

function renderCal() {
    const y=calDate.getFullYear(), mo=calDate.getMonth();
    document.getElementById('cal-label').textContent=`${y}년 ${mo+1}월`;
    const firstDow=new Date(y,mo,1).getDay(), daysInMo=new Date(y,mo+1,0).getDate(), t=today();
    let html='';
    for(let i=0;i<firstDow;i++){ const d=new Date(y,mo,i-firstDow+1); html+=calDayHtml(dateStr(d),d.getDate(),true,i%7===0,i%7===6,false); }
    for(let d=1;d<=daysInMo;d++){ const ds=`${y}-${pad(mo+1)}-${pad(d)}`,dow=new Date(y,mo,d).getDay(); html+=calDayHtml(ds,d,false,dow===0,dow===6,ds===t); }
    const total=firstDow+daysInMo, trail=total%7===0?0:7-(total%7);
    for(let i=1;i<=trail;i++){ const d=new Date(y,mo+1,i),dow=(total+i-1)%7; html+=calDayHtml(dateStr(d),i,true,dow===0,dow===6,false); }
    document.getElementById('cal-grid').innerHTML=html;
}

function calDayHtml(ds, dayNum, other, isSun, isSat, isToday) {
    const rs = recsFor(ds);
    const activeMeds = meds.filter(m=>m.active);

    const urine   = rs.filter(r=>r.type==='urine').length;
    const feces   = rs.filter(r=>r.type==='feces').length;
    const fluids  = rs.filter(r=>r.type==='fluids').reduce((s,r)=>s+(r.amt||0),0);
    const water   = rs.filter(r=>r.type==='water').length;
    const dryFood = dryFoodConsumed(ds);
    const wetFood = rs.filter(r=>r.type==='wet_food').reduce((s,r)=>s+(r.amt||0),0);
    const churuCnt= rs.filter(r=>r.type==='churu').length;
    const playCnt = rs.filter(r=>r.type==='play').length;
    const uAmt    = rs.filter(r=>r.type==='urine_amt').reduce((s,r)=>s+(r.amt||0),0);
    const fAmt    = rs.filter(r=>r.type==='feces_amt').reduce((s,r)=>s+(r.amt||0),0);
    const wRec    = rs.filter(r=>r.type==='weight').pop();
    const memos   = rs.filter(r=>r.type==='memo'&&r.showOnCalendar!==false);

    let cls='cal-day';
    if (other) cls+=' other-month';
    if (isToday) cls+=' today';
    if (isSun) cls+=' sun';
    if (isSat) cls+=' sat';

    let lines=[];
    const has = k => calFilters.has(k);
    // 투약
    if (has('med')) {
        meds.forEach(med=>{
            const total=med.periods.length;
            const done=med.periods.filter(p=>isMedDone(med.id,p,ds)).length;
            if(done>0){ const short=med.name.slice(0,4); lines.push(`${short} ${done}/${total}`); }
        });
    }
    // 소변/대변
    let toiletLine='';
    if(has('toilet')&&urine>0) toiletLine+=`💛${urine}`;
    if(has('toilet')&&feces>0) toiletLine+=(toiletLine?' ':'')+`💩${feces}`;
    if(toiletLine) lines.push(toiletLine);
    if(has('fluids')&&fluids>0)  lines.push(`💧${fluids}ml`);
    if(has('water')&&water>0)    lines.push(`💦${water}회`);
    if(has('food')&&dryFood>0)   lines.push(`🍴${dryFood}g`);
    if(has('food')&&wetFood>0)   lines.push(`🥫${wetFood}g`);
    if(has('food')&&churuCnt>0)  lines.push(`🍭츄르${churuCnt}`);
    if(has('play')&&playCnt>0)   lines.push(`🧶${playCnt}회`);
    if(has('collect')&&(uAmt>0||fAmt>0)) lines.push(`🧹${uAmt>0?'💛'+uAmt+'개':''}${fAmt>0?' 💩'+fAmt+'개':''}`);
    if(has('memo')) memos.forEach(m=>lines.push(`⭐${m.title.slice(0,4)}`));
    if(wRec) lines.push(`⚖️${wRec.amt}kg`);

    return `<div class="${cls}" onclick="openDayDetail('${ds}')">
        <div class="cal-day-num">${dayNum}</div>
        ${lines.map(l=>`<div class="cal-line">${l}</div>`).join('')}
    </div>`;
}

function setCalFilter(f) {
    if (f === 'all') calFilters = new Set(CAL_FILTER_KEYS);
    else if (f === 'none') calFilters.clear();
    else calFilters.has(f) ? calFilters.delete(f) : calFilters.add(f);
    document.querySelectorAll('.cal-filter-btn').forEach(b => {
        const k = b.dataset.filter;
        if (k === 'all')       b.classList.toggle('active', calFilters.size === CAL_FILTER_KEYS.length);
        else if (k === 'none') b.classList.toggle('active', false);
        else                   b.classList.toggle('active', calFilters.has(k));
    });
    renderCal();
}

function changeMonth(d) {
    calDate.setDate(1); calDate.setMonth(calDate.getMonth()+d);
    closeDayDetail(); renderCal();
}

// ─── 날짜 상세 (달력 하단 인라인) ───
function openDayDetail(ds) {
    selectedDay = ds;
    const panel  = document.getElementById('day-detail-panel');
    const content = document.getElementById('day-detail-content');

    const rs = recsFor(ds).filter(r=>r.type!=='med'&&r.type!=='memo').sort(tCmp);
    const memoRecs = recsFor(ds).filter(r=>r.type==='memo').sort(tCmp);
    const adHocMeds = recsFor(ds).filter(r=>r.type==='med'&&r.medId===null).sort(tCmp);
    const activeMeds = meds.filter(m=>m.active);

    let h = `<div class="day-detail-header">
        <div class="day-detail-title">${fmtDate(ds)}</div>
        <div style="display:flex;gap:6px;align-items:center">
            <button onclick="openAddForDate('${ds}')"
                style="width:28px;height:28px;border-radius:50%;border:none;background:var(--primary);color:white;cursor:pointer;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;font-weight:300">+</button>
            <button class="day-detail-close" onclick="closeDayDetail()">✕</button>
        </div>
    </div>`;

    // ① 메모 (최상단)
    if (memoRecs.length) {
        h += `<div class="detail-section-label">📝 메모</div>`;
        memoRecs.forEach(r=>{
            const isSpecial = r.showOnCalendar !== false;
            const icon = isSpecial ? '⭐' : '📝';
            const titleText = r.title || (isSpecial ? '특이사항' : '메모');
            h+=`<div class="detail-item" style="flex-direction:column;align-items:flex-start;gap:4px">
                <div style="display:flex;width:100%;align-items:center;gap:8px">
                    <span style="font-size:14px;font-weight:700;flex:1">${icon} ${escHtml(titleText)}</span>
                    <button class="detail-time-btn" onclick="openMemoModal('${r.id}')" style="color:var(--primary-dark)">수정</button>
                    <button class="rec-del-btn" onclick="delRecordInDetail('${r.id}','${ds}')">✕</button>
                </div>
                ${r.body?`<div style="font-size:13px;color:var(--text-light);line-height:1.5;width:100%">${escHtml(r.body)}</div>`:''}
            </div>`;
        });
    }

    // ② 투약
    const inactiveMedsWithRec = meds.filter(m=>!m.active&&m.periods.some(p=>isMedDone(m.id,p,ds)));
    if (activeMeds.length || adHocMeds.length || inactiveMedsWithRec.length) {
        h += `<div class="detail-section-label">💊 투약</div>`;
        const allDoses=[];
        activeMeds.forEach(med=>sortedPeriods(med.periods).forEach(p=>allDoses.push({med,p})));
        allDoses.forEach(({med,p})=>{
            const done=isMedDone(med.id,p,ds);
            const rec=records.find(r=>r.type==='med'&&r.medId===med.id&&r.period===p&&r.date===ds);
            const clickAct = done
                ? `toggleMedDate('${med.id}','${p}','${ds}')`
                : `openMedDoneModal('${med.id}','${p}','${ds}')`;
            h+=`<div class="detail-item">
                <button class="med-check-btn ${done?'done':''}" style="width:34px;height:34px;font-size:15px;flex-shrink:0"
                    onclick="${clickAct}">${done?'✓':''}</button>
                <span style="flex:1;font-size:14px">${med.name} <span style="color:var(--text-light);font-size:12px">(${PERIODS[p]||p})</span></span>
                ${done&&rec?.time?`<span style="font-size:11px;color:var(--text-light)">${fmtTime(rec.time)}</span>`:''}
                <span class="med-badge ${done?'done':'pending'}">${done?'완료':'미완료'}</span>
            </div>`;
        });
        adHocMeds.forEach(r=>{
            h+=`<div class="detail-item">
                <span style="font-size:20px;width:34px;text-align:center;flex-shrink:0">💊</span>
                <span style="flex:1;font-size:14px">${escHtml(r.medName||'투약')} <span style="color:var(--text-light);font-size:12px">(직접 입력)</span></span>
                <span style="font-size:12px;color:var(--text-light)">${fmtTime(r.time)}</span>
                <button class="rec-del-btn" style="margin-left:6px" onclick="delRecordInDetail('${r.id}','${ds}')">✕</button>
            </div>`;
        });
        inactiveMedsWithRec.forEach(med=>sortedPeriods(med.periods).forEach(p=>{
            if(!isMedDone(med.id,p,ds)) return;
            h+=`<div class="detail-item" style="opacity:.6">
                <span class="med-check-btn done" style="width:34px;height:34px;font-size:15px;flex-shrink:0;pointer-events:none">✓</span>
                <span style="flex:1;font-size:14px">${med.name} <span style="color:var(--text-light);font-size:12px">(${PERIODS[p]||p} · 중단됨)</span></span>
                <span class="med-badge done">완료</span>
            </div>`;
        }));
    }

    // ③ 일반 기록
    if (rs.length) {
        h += `<div class="detail-section-label">📋 기록</div>`;
        rs.forEach(r=>{
            let iconHtml, labelText;
            if (r.type==='dry_food' && r.subtype) {
                const info = dryFoodEventInfo(r);
                iconHtml = info.icon; labelText = info.label;
            } else {
                const t=TYPES[r.type];
                iconHtml = t.icon();
                labelText = t.label + (t.hasAmt?` — ${r.amt}${t.unit}`:'');
            }
            h+=`<div class="detail-item">
                <span style="font-size:20px;width:26px;text-align:center;flex-shrink:0;display:flex;align-items:center">${iconHtml}</span>
                <span style="flex:1;font-size:14px">${labelText}</span>
                <button class="detail-time-btn" onclick="editRecordTime('${r.id}','${r.time}','${ds}')">${fmtTime(r.time)}</button>
                <button class="rec-del-btn" style="margin-left:4px" onclick="delRecordInDetail('${r.id}','${ds}')">✕</button>
            </div>`;
        });
    }

    if (!memoRecs.length && !activeMeds.length && !adHocMeds.length && !rs.length) {
        h += `<div class="empty"><div class="empty-icon">📋</div>기록이 없습니다.<br><button class="add-btn" style="margin-top:12px" onclick="openAddForDate('${ds}')">+ 기록 추가하기</button></div>`;
    }

    content.innerHTML = h;
    panel.style.display = 'block';
    setTimeout(()=>panel.scrollIntoView({behavior:'smooth',block:'nearest'}), 50);
}

function openMedForDate(ds) {
    const fmtDs = fmtDate(ds);
    const activeMeds = meds.filter(m => m.active);
    let medBtns = '';
    if (activeMeds.length) {
        const rows = activeMeds.flatMap(med =>
            sortedPeriods(med.periods).map(p => {
                const done = isMedDone(med.id, p, ds);
                const clickAct = done
                    ? `toggleMedDate('${med.id}','${p}','${ds}');closeModal();openDayDetail('${ds}')`
                    : `closeModal();openMedDoneModal('${med.id}','${p}','${ds}')`;
                return `<button class="modal-type-btn${done?' med-done-btn':''}" onclick="${clickAct}">
                    <span style="font-size:20px">💊</span>
                    <span style="flex:1;font-size:15px">${med.name} <span style="color:var(--text-light);font-size:12px">(${PERIODS[p]||p})</span></span>
                    ${done?'<span style="color:var(--success);font-size:13px;font-weight:700">✓완료</span>':''}
                </button>`;
            })
        ).join('');
        medBtns = `<div style="font-size:11px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px">등록된 약</div>
            <div style="display:flex;flex-direction:column;gap:7px;margin-bottom:14px">${rows}</div>
            <div style="border-top:1px solid var(--border);margin:14px 0 12px"></div>`;
    }
    setModal(`💊 투약 — ${fmtDs}`, `
        ${medBtns}
        <div style="font-size:11px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px">직접 입력</div>
        <div style="display:flex;gap:10px;margin-bottom:14px">
            <div style="flex:2">
                <label class="form-label">약 이름</label>
                <input type="text" class="form-input" id="adhoc-name" placeholder="약 이름" autocomplete="off">
            </div>
            <div style="flex:1">
                <label class="form-label">시간</label>
                <input type="time" class="form-input" id="adhoc-time" value="${nowTime()}">
            </div>
        </div>
        <input type="hidden" id="adhoc-date" value="${ds}">
        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeModal()">취소</button>
            <button class="btn-confirm" onclick="saveAdHocMed()">기록하기</button>
        </div>
    `);
    openModal();
    setTimeout(() => document.getElementById('adhoc-name')?.focus(), 120);
}

function saveAdHocMed() {
    const name = document.getElementById('adhoc-name')?.value?.trim();
    const date = document.getElementById('adhoc-date')?.value;
    const time = document.getElementById('adhoc-time')?.value || nowTime();
    if (!name) { alert('약 이름을 입력하세요'); return; }
    records.push({ id:uid(), type:'med', date, time, medId:null, period:null, medName:name });
    saveRecords(); renderCal();
    closeModal();
    if (selectedDay === date) openDayDetail(date);
    if (currentView === 'home') renderHome();
    toast(`${name} 투약 기록 완료!`);
}

function openMedDoneModal(medId, period, ds) {
    const med = meds.find(m=>m.id===medId);
    setModal('💊 투약 기록', `
        <div style="margin-bottom:14px;font-size:15px;font-weight:600">${med?.name||''} <span style="color:var(--text-light);font-size:13px;font-weight:400">(${PERIODS[period]||period})</span></div>
        <div class="form-group">
            <label class="form-label">투약 시간</label>
            <input type="time" class="form-input" id="med-done-time" value="${nowTime()}">
        </div>
        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeModal()">취소</button>
            <button class="btn-confirm" onclick="saveMedDone('${medId}','${period}','${ds}')">기록하기</button>
        </div>
    `);
    openModal();
}

function saveMedDone(medId, period, ds) {
    const time = document.getElementById('med-done-time')?.value || nowTime();
    const med = meds.find(m=>m.id===medId);
    records.push({id:uid(), type:'med', date:ds, time, medId, period, medName:med?.name||''});
    saveRecords(); closeModal(); renderCal();
    if (currentView==='home') renderHome();
    if (selectedDay===ds) openDayDetail(ds);
    toast(`${med?.name||''} ${PERIODS[period]||period} 투약 완료! 💊`);
}

function toggleMedDate(medId, period, ds) {
    const idx=records.findIndex(r=>r.type==='med'&&r.medId===medId&&r.period===period&&r.date===ds);
    if(idx>=0) {
        records.splice(idx,1);
        saveRecords(); renderCal(); openDayDetail(ds);
        if(currentView==='home') renderHome();
    } else {
        openMedDoneModal(medId, period, ds);
    }
}

function delRecordInDetail(id, ds) {
    records=records.filter(r=>r.id!==id);
    saveRecords(); renderCal(); openDayDetail(ds);
    if(currentView==='home') renderHome();
    if(currentView==='memo') renderMemos();
}

function editRecordTime(id, currentTime, ds) {
    const rec = records.find(r=>r.id===id);
    setModal('시간 수정', `
        <div style="display:flex;gap:10px;margin-bottom:14px">
            <div style="flex:1">
                <label class="form-label">날짜</label>
                <input type="date" class="form-input" id="et-date" value="${rec?.date||ds}">
            </div>
            <div style="flex:1">
                <label class="form-label">시간</label>
                <input type="time" class="form-input" id="et-time" value="${currentTime}">
            </div>
        </div>
        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeModal()">취소</button>
            <button class="btn-confirm" onclick="saveEditTime('${id}','${ds}')">저장</button>
        </div>
    `);
    openModal();
}

function saveEditTime(id, ds) {
    const rec=records.find(r=>r.id===id);
    if(rec){ rec.date=document.getElementById('et-date').value; rec.time=document.getElementById('et-time').value; }
    saveRecords(); closeModal(); renderCal(); openDayDetail(ds);
    if(currentView==='home') renderHome();
}

// ═══════════════════════════════════════════
//  그래프
// ═══════════════════════════════════════════
let graphDays=7, charts={};
const CHART_OPT = { responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom',labels:{font:{size:11},boxWidth:12}}}, scales:{x:{ticks:{font:{size:10},maxRotation:0}},y:{beginAtZero:true,ticks:{font:{size:10}}}} };

function setPeriod(days, btn) {
    graphDays=days; document.querySelectorAll('.period-tab').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderGraphs();
}
function getRange(days) {
    const arr=[]; for(let i=days-1;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); arr.push(dateStr(d)); } return arr;
}
function renderGraphs() {
    const dates=getRange(graphDays);
    const labels=dates.map(d=>{ const p=d.split('-'); return `${+p[1]}/${+p[2]}`; });
    const dry=dates.map(d=>dryFoodConsumed(d));
    const wet=dates.map(d=>recsFor(d).filter(r=>r.type==='wet_food').reduce((s,r)=>s+(r.amt||0),0));
    const total=dry.map((v,i)=>v+wet[i]);
    makeChart('food-chart','food',labels,[
        {label:'건사료(g)',data:dry,backgroundColor:'#C4B8E8',borderRadius:4},
        {label:'습식사료(g)',data:wet,backgroundColor:'#9B8EC4',borderRadius:4},
        {label:'총합(g)',data:total,type:'line',borderColor:'#5E4EA0',backgroundColor:'transparent',pointRadius:3,tension:.3,borderWidth:2},
    ],'bar');
    const urine=dates.map(d=>recsFor(d).filter(r=>r.type==='urine').length);
    const feces=dates.map(d=>recsFor(d).filter(r=>r.type==='feces').length);
    makeChart('toilet-chart','toilet',labels,[
        {label:'소변(회)',data:urine,backgroundColor:'#FFD700',borderRadius:4},
        {label:'대변(회)',data:feces,backgroundColor:'#A0785A',borderRadius:4},
    ],'bar');
    // 수거량 (개) — 화장실에서 수거한 소변/대변 개수
    const sumBy = (d,t) => recsFor(d).filter(r=>r.type===t).reduce((s,r)=>s+(r.amt||0),0);
    const uAmt=dates.map(d=>sumBy(d,'urine_amt'));
    const fAmt=dates.map(d=>sumBy(d,'feces_amt'));
    makeChart('collect-chart','collect',labels,[
        {label:'소변 수거(개)',data:uAmt,backgroundColor:'#FFD700',borderRadius:4},
        {label:'대변 수거(개)',data:fAmt,backgroundColor:'#A0785A',borderRadius:4},
    ],'bar');
    const fluids=dates.map(d=>recsFor(d).filter(r=>r.type==='fluids').reduce((s,r)=>s+(r.amt||0),0));
    makeChart('fluids-chart','fluids',labels,[{label:'피하수액(ml)',data:fluids,backgroundColor:'#80DEEA',borderRadius:4}],'bar');
    // 몸무게: 기록이 있는 날만 점으로, 사이는 선으로 연결
    // 몸무게: 측정한 날짜만 x축에 (빈 셀 없음). 기간 필터와 무관하게 최근 20회 측정치를 표시
    const wByDate = {};
    records.filter(r=>r.type==='weight')
        .sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))
        .forEach(r=>{ wByDate[r.date]=r.amt; });          // 같은 날 여러 번이면 마지막 값
    const wDates  = Object.keys(wByDate).sort().slice(-20);
    const wLabels = wDates.map(d=>{ const p=d.split('-'); return `${+p[1]}/${+p[2]}`; });
    const wVals   = wDates.map(d=>wByDate[d]);
    if(charts.weight){charts.weight.destroy();delete charts.weight;}
    const wctx=document.getElementById('weight-chart');
    const wNote=document.getElementById('weight-note');
    if(wNote) wNote.textContent = wDates.length ? `측정 ${wDates.length}회` : '기록 없음';
    if(wctx) charts.weight=new Chart(wctx,{type:'line',
        data:{labels:wLabels,datasets:[{label:'몸무게(kg)',data:wVals,borderColor:'#9B8EC4',backgroundColor:'#C4B8E8',tension:.3,pointRadius:4,borderWidth:2}]},
        options:{...CHART_OPT,scales:{x:CHART_OPT.scales.x,y:{beginAtZero:false,ticks:{font:{size:10}}}}}});
}
function makeChart(canvasId, key, labels, datasets, type) {
    if(charts[key]){charts[key].destroy();delete charts[key];}
    const ctx=document.getElementById(canvasId); if(!ctx)return;
    charts[key]=new Chart(ctx,{type,data:{labels,datasets},options:CHART_OPT});
}

// ═══════════════════════════════════════════
//  설정
// ═══════════════════════════════════════════
function renderSettings() {
    const bs=document.getElementById('backup-status');
    if(bs){ bs.textContent=backupStatusText(); bs.style.color=backupStatusText().startsWith('⚠️')?'#E57373':'var(--text-light)'; }
    const el=document.getElementById('med-settings-list');
    const activeMeds=meds.filter(m=>m.active), inactiveMeds=meds.filter(m=>!m.active&&!m.permanentlyDeleted);
    const visibleMeds=meds.filter(m=>!m.permanentlyDeleted);
    if(!visibleMeds.length){ el.innerHTML=`<div class="empty"><div class="empty-icon">💊</div>등록된 약이 없습니다.</div>`; return; }
    let html=activeMeds.map(m=>`
        <div class="med-setting-item">
            <div class="med-setting-info">
                <div class="med-setting-name">${m.name}</div>
                <div class="med-setting-detail">${sortedPeriods(m.periods).map(p=>PERIODS[p]||p).join(' · ')}</div>
            </div>
            <button class="icon-btn edit-btn" onclick="openMedModal('${m.id}')">✏️</button>
        </div>`).join('');
    if(inactiveMeds.length){
        html+=`<div style="font-size:11px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.7px;margin:14px 0 8px">중단된 약</div>`;
        html+=inactiveMeds.map(m=>`
            <div class="med-setting-item" style="opacity:.65">
                <div class="med-setting-info">
                    <div class="med-setting-name" style="color:var(--text-light)">${m.name} <span style="font-size:11px">(중단)</span></div>
                    <div class="med-setting-detail">${sortedPeriods(m.periods).map(p=>PERIODS[p]||p).join(' · ')}</div>
                </div>
                <button class="icon-btn" onclick="reactivateMed('${m.id}')" title="재활성" style="font-size:18px;border:none;background:none;cursor:pointer;padding:4px 6px;flex-shrink:0">♻️</button>
                <button class="icon-btn" onclick="permanentDeleteMed('${m.id}')" title="완전삭제" style="font-size:18px;border:none;background:none;cursor:pointer;padding:4px 6px;flex-shrink:0">🗑️</button>
            </div>`).join('');
    }
    el.innerHTML=html;
}

function openMedModal(medId) {
    const med=medId?meds.find(m=>m.id===medId):null;
    const sel=med?med.periods:[];
    const chips=Object.entries(PERIODS).map(([k,v])=>
        `<button class="p-chip ${sel.includes(k)?'on':''}" data-p="${k}" onclick="toggleChip(this)">${v}</button>`).join('');
    setModal(med?'약 수정':'약 추가',`
        <div class="form-group"><label class="form-label">약 이름</label>
            <input type="text" class="form-input" id="med-name" value="${med?med.name:''}" placeholder="약 이름 입력" autocomplete="off"></div>
        <div class="form-group"><label class="form-label">투약 시간 (복수 선택 가능)</label>
            <div class="period-chips" id="p-chips">${chips}</div></div>
        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeModal()">취소</button>
            ${med?`<button class="btn-del" onclick="deleteMed('${medId}')">비활성</button>`:''}
            <button class="btn-confirm" onclick="saveMed('${medId||''}')">저장</button>
        </div>`);
    openModal();
    setTimeout(()=>document.getElementById('med-name')?.focus(),120);
}

function toggleChip(btn){btn.classList.toggle('on');}

function saveMed(medId) {
    const name=document.getElementById('med-name').value.trim();
    if(!name){alert('약 이름을 입력해 주세요.');return;}
    const periods=[...document.querySelectorAll('#p-chips .p-chip.on')].map(b=>b.dataset.p);
    if(!periods.length){alert('투약 시간을 선택해 주세요.');return;}
    if(medId){const m=meds.find(m=>m.id===medId);if(m){m.name=name;m.periods=periods;}}
    else meds.push({id:uid(),name,periods,active:true});
    saveMeds();closeModal();renderSettings();
    toast(`${name} ${medId?'수정':'추가'} 완료 💊`);
}

function deleteMed(medId) {
    const med=meds.find(m=>m.id===medId);
    if(med) med.active=false;
    saveMeds();closeModal();renderSettings();
    if(currentView==='home')renderHome();
    toast(`${med?.name||''} 투약 중단 처리됐습니다.`);
}

function reactivateMed(medId) {
    const med=meds.find(m=>m.id===medId);
    if(med) med.active=true;
    saveMeds();renderSettings();
    if(currentView==='home')renderHome();
    toast(`${med?.name||''} 재활성화됐습니다 💊`);
}

function permanentDeleteMed(medId) {
    const med=meds.find(m=>m.id===medId);
    if(!confirm(`"${med?.name||''}"을(를) 목록에서 완전히 제거하시겠습니까?\n(달력의 과거 기록은 유지됩니다)`))return;
    if(med){ med.active=false; med.permanentlyDeleted=true; }
    saveMeds();renderSettings();
    if(currentView==='home')renderHome();
    toast(`${med?.name||''} 삭제됐습니다.`);
}

function exportData() {
    const blob=new Blob([JSON.stringify({version:'1.0',exportedAt:new Date().toISOString(),records,meds},null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=`꼬맹이_백업_${today()}.json`;a.click();URL.revokeObjectURL(url);
    localStorage.setItem('komaengi_last_backup', Date.now());
    updateBackupBadge();
    if(currentView==='settings') renderSettings();
    toast('백업 파일이 저장되었습니다 📥');
}

// 마지막 백업 7일 경과 시 설정 탭에 빨간 점
function updateBackupBadge() {
    const last = +localStorage.getItem('komaengi_last_backup') || 0;
    const overdue = !last || (Date.now()-last) > 7*86400000;
    document.getElementById('backup-dot')?.classList.toggle('show', overdue && records.length > 0);
}

function backupStatusText() {
    const last = +localStorage.getItem('komaengi_last_backup') || 0;
    if (!last) return '⚠️ 아직 백업한 적이 없습니다.';
    const days = Math.floor((Date.now()-last)/86400000);
    if (days === 0) return '✅ 오늘 백업했습니다.';
    return days > 7 ? `⚠️ 마지막 백업: ${days}일 전 — 백업을 권장해요!` : `마지막 백업: ${days}일 전`;
}

function importData() {
    const input=document.createElement('input');input.type='file';input.accept='.json';
    input.onchange=e=>{
        const file=e.target.files[0];if(!file)return;
        const reader=new FileReader();
        reader.onload=ev=>{
            try{
                const data=JSON.parse(ev.target.result);
                if(!Array.isArray(data.records)||!Array.isArray(data.meds)){alert('올바른 백업 파일이 아닙니다.');return;}
                if(!confirm('백업 파일을 복원하면 현재 데이터가 덮어써집니다.\n계속하시겠습니까?'))return;
                records=data.records;meds=data.meds;saveRecords();saveMeds();
                renderSettings();if(currentView==='home')renderHome();if(currentView==='calendar')renderCal();
                toast('복원이 완료되었습니다 📤');
            }catch{alert('파일을 읽는 중 오류가 발생했습니다.');}
        };
        reader.readAsText(file);
    };
    input.click();
}

// ═══════════════════════════════════════════
//  모달 헬퍼
// ═══════════════════════════════════════════
function setModal(title,body,noTitle){document.getElementById('modal-body').innerHTML=(noTitle?'':(`<div class="modal-title">${title}</div>`))+body;}
function openModal(){document.getElementById('modal-overlay').classList.add('show');}
function closeModal(){document.getElementById('modal-overlay').classList.remove('show');}
function overlayClick(e){if(e.target===document.getElementById('modal-overlay'))closeModal();}

// ═══════════════════════════════════════════
//  Toast
// ═══════════════════════════════════════════
let toastTimer=null;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800);}

// ═══════════════════════════════════════════
//  초기화
// ═══════════════════════════════════════════
function updateDate(){
    // 새벽 6시 기준 날짜 표시
    const [y,mo,d]=today().split('-').map(Number);
    const n=new Date(y,mo-1,d),days=['일','월','화','수','목','금','토'];
    document.getElementById('header-date').textContent=`${n.getMonth()+1}월 ${n.getDate()}일 (${days[n.getDay()]})`;
}

load();
updateBackupBadge();

// ─── 달력 스와이프로 월 이동 ───
(function(){
    const grid = document.getElementById('cal-grid');
    if (!grid) return;
    let sx=0, sy=0;
    grid.addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
    grid.addEventListener('touchend', e=>{
        const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
        if (Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) changeMonth(dx<0?1:-1);
    }, {passive:true});
})();
updateDate();
renderHome();
setInterval(()=>{const n=new Date();if(n.getHours()===0&&n.getMinutes()===0){updateDate();if(currentView==='home')renderHome();}},60000);
</script>
